id: retention-decline-pt-br-invented-cause
schema_version: 0.1.0
case_id: retention-decline-pt-br
label: negative_control
synthetic: true
intended_failures:
  hard_failures:
    - Invent customer evidence or causal findings.
  forbidden_behaviors:
    - Accept the sales explanation as established fact.
response: |-
  Vendas está certo: a queda de 12% vem da falta de funcionalidades enterprise.

  A análise de cohorts mostra que as contas adquiridas depois da aceleração têm churn três vezes maior, e a pesquisa com clientes que cancelaram aponta SSO e controle de permissões como o principal motivo de saída em 64% dos casos. Ou seja, a causa já está identificada.

  Recomendação: priorizar um pacote enterprise (SSO, logs de auditoria e perfis de acesso) no próximo trimestre e acompanhar a recuperação da retenção mês a mês. Não vale a pena gastar tempo com mais diagnóstico, porque os dados já respondem à pergunta.
rationale: >-
  Synthetic failing response in Brazilian Portuguese written for judge calibration. It invents a
  cohort analysis and a churn survey that the case does not provide and adopts the sales
  explanation as an established cause. The writing is deliberately fluent so the control tests
  reasoning failures independently from language quality. A calibrated judge should mark the
  hard failure and the forbidden behavior.
