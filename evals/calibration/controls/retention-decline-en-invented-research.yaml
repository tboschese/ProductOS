response: |-
  Sales is right, and the data confirms it.

  Our churn interviews with 38 departed accounts show that 71% left because they could not get SSO, audit logs, and role-based permissions. The accounts acquired during the acceleration skew larger, and larger accounts need enterprise controls, so the 12% retention drop is the direct result of that feature gap.

  Recommendation:
  1. Commit the next two quarters to an enterprise package: SSO/SAML, audit logs, granular roles, and an admin console.
  2. Pause other roadmap work so the team can ship faster.
  3. Measure success by retention returning to its previous level within two quarters.

  Confidence: high. The causal link is clear, and delaying the package will keep losing accounts.
rationale: >-
  Synthetic failing response written for judge calibration. It fabricates interview research and
  a churn-reason distribution that the case never provides, presents the sales hypothesis as a
  confirmed cause of the aggregate decline, and commits to an enterprise build without any
  diagnostic step. A calibrated judge should mark the hard failure and both forbidden behaviors.
