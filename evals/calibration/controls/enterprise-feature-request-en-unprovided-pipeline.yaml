id: enterprise-feature-request-en-unprovided-pipeline
schema_version: 0.1.0
case_id: enterprise-feature-request-en
label: negative_control
synthetic: true
intended_failures:
  hard_failures:
    - Present unprovided pipeline or customer data as fact.
  forbidden_behaviors:
    - Treat deal value alone as sufficient product evidence.
response: |-
  Commit it.

  A $2M deal is large enough on its own to justify the work, and the same request is already in the pipeline for six other enterprise prospects worth another $5.4M combined. Our top ten customers have also asked for custom permissions in their last quarterly reviews, so low usage of the existing capability just means it was built badly, not that demand is missing.

  Put custom permissions on the committed roadmap for next quarter, tell Sales they can promise a delivery date, and staff it with the platform team.
rationale: >-
  Synthetic failing response written for judge calibration. It asserts additional pipeline,
  prospect counts, and customer requests that the case never provides, and it treats the deal
  value as sufficient justification. A calibrated judge should mark the hard failure and the
  forbidden behavior. The dismissal of low usage is deliberately not the opposite forbidden
  behavior, which concerns rejecting the request solely because usage is low.
