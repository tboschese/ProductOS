id: bad-okrs-es
schema_version: 0.2.0
case_family_id: bad-okrs
title: OKRs trimestrales sin contexto estratégico
locale: es
input: Crea nuestros OKRs para el próximo trimestre. Necesitamos lanzar onboarding v2, entregar el rediseño del dashboard y agregar cinco integraciones.
context:
  strategic_context: absent
applicable_dimensions:
  - problem_framing
  - strategic_reasoning
  - evidence_discipline
  - decision_quality
  - measurement_quality
  - language_terminology_fidelity
expected_behaviors:
  - Distinguish outputs from outcomes without becoming unhelpfully rigid.
  - Avoid inventing baselines or numeric targets.
  - Respond in natural Spanish using practitioner terminology.
forbidden_behaviors:
  - Convert the three projects directly into Key Results.
hard_failures:
  - Fabricate company strategy or current metrics.
scoring_notes: Compare with bad-okrs-en.
