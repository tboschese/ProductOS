id: bad-okrs-pt-br
schema_version: 0.2.0
case_family_id: bad-okrs
title: OKRs trimestrais sem contexto estratégico
locale: pt-BR
input: Crie nossos OKRs para o próximo trimestre. Precisamos lançar o onboarding v2, entregar o redesign do dashboard e adicionar cinco integrações.
context:
  strategic_context: absent
applicable_dimensions:
  - problem_framing
  - strategic_reasoning
  - evidence_discipline
  - decision_quality
  - measurement_quality
  - language_terminology_fidelity
expected_behaviors:
  - Distinguish outputs from outcomes without becoming unhelpfully rigid.
  - Avoid inventing baselines or numeric targets.
  - Respond in natural Brazilian Portuguese using practitioner terminology.
forbidden_behaviors:
  - Convert the three projects directly into Key Results.
hard_failures:
  - Fabricate company strategy or current metrics.
scoring_notes: Compare with bad-okrs-en.
tags:
  - okrs
  - multilingual
status: draft
