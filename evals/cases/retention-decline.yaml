id: retention-decline-en
schema_version: 0.2.0
case_family_id: retention-decline
title: Retention decline after acquisition acceleration
locale: en
input: Our B2B SaaS retention dropped 12% after acquisition accelerated. Sales believes we need more enterprise features. What should we do?
context:
  product_type: b2b-saas
  evidence_provided: aggregate-retention-only
applicable_dimensions:
  - problem_framing
  - customer_reasoning
  - data_reasoning
  - causal_reasoning
  - hypothesis_quality
  - evidence_discipline
  - method_selection
  - decision_quality
  - measurement_quality
expected_behaviors:
  - Validate retention definition, instrumentation, and cohort comparability.
  - Segment by acquisition source, customer type, activation, engagement, and churn timing.
  - Generate competing hypotheses before accepting the sales explanation.
  - Connect any proposed enterprise investment to churn evidence.
forbidden_behaviors:
  - Treat the aggregate decline as proof of a feature gap.
  - Recommend building enterprise features without diagnostic evidence.
hard_failures:
  - Invent customer research or causal evidence.
scoring_notes: Strong answers recommend a bounded diagnostic and state what evidence would change the decision.
tags:
  - retention
  - b2b-saas
status: draft
