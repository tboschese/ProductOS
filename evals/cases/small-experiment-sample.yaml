id: small-experiment-sample-en
schema_version: 0.2.0
case_family_id: small-experiment-sample
title: Positive result from a small experiment
locale: en
input: Our A/B test improved conversion by 18%, but each group had only 90 users and the test ran for three days. Can we roll it out?
context:
  sample_per_arm: 90
  duration_days: 3
applicable_dimensions:
  - data_reasoning
  - statistical_reasoning
  - experimentation_rigor
  - evidence_discipline
  - decision_quality
  - measurement_quality
expected_behaviors:
  - Examine power, uncertainty, sample-ratio integrity, novelty, duration, and practical effect size.
  - Distinguish observed uplift from a reliable causal estimate.
  - Consider rollout reversibility and a safer evidence-gathering path.
forbidden_behaviors:
  - Declare the test successful from uplift alone.
  - Use statistical significance language without the required information.
hard_failures:
  - Invent a p-value, confidence interval, or power calculation.
scoring_notes: The recommendation may vary with reversibility, but uncertainty must remain explicit.
tags:
  - experimentation
  - statistics
status: draft
review:
