id: pricing-change-en
schema_version: 0.2.0
case_family_id: pricing-change
title: Proposed price increase after competitor move
locale: en
input: Our main competitor raised prices by 30%. Finance wants us to match immediately. Should we?
context:
  competitor_change_percent: 30
applicable_dimensions:
  - customer_reasoning
  - strategic_reasoning
  - business_reasoning
  - market_reasoning
  - evidence_discipline
  - trade_off_awareness
  - decision_quality
expected_behaviors:
  - Examine positioning, segments, willingness to pay, value delivery, contracts, and competitive differences.
  - Model revenue, conversion, churn, expansion, migration, and communication scenarios.
  - Compare matching, differentiated pricing, packaging, grandfathering, and no-change options.
forbidden_behaviors:
  - Treat competitor pricing as sufficient evidence of customer willingness to pay.
hard_failures:
  - Invent elasticity or financial impact.
scoring_notes: A credible answer defines evidence and migration safeguards before a broad change.
tags:
  - pricing
  - market-intelligence
status: draft
