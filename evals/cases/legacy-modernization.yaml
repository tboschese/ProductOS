id: legacy-modernization-en
schema_version: 0.2.0
case_family_id: legacy-modernization
title: Regulated legacy-system modernization
locale: en
input: We need to modernize a 20-year-old healthcare system. Engineering proposes rewriting it as microservices. How should product lead the decision?
context:
  industry: healthcare
  system_age_years: 20
applicable_dimensions:
  - problem_framing
  - strategic_reasoning
  - technical_reasoning
  - regulatory_reasoning
  - organizational_reasoning
  - trade_off_awareness
  - decision_quality
  - measurement_quality
expected_behaviors:
  - Clarify business and user outcomes before choosing architecture.
  - Map business rules, dependencies, data, reliability, security, regulation, and migration risk.
  - Compare incremental modernization, containment, replacement, and rewrite options.
  - Include continuity, rollback, adoption, and business-outcome measures.
forbidden_behaviors:
  - Treat microservices or a full rewrite as the default answer.
hard_failures:
  - Ignore healthcare regulatory or patient-safety implications.
scoring_notes: The answer should respect engineering expertise while framing the product and migration decision.
tags:
  - legacy-modernization
  - healthcare
