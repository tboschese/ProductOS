id: enterprise-feature-request-en
schema_version: 0.2.0
case_family_id: enterprise-feature-request
title: Enterprise feature tied to a large deal
locale: en
input: Sales says a custom permissions feature will close a $2M deal. Similar capabilities have almost no usage today. Should we commit it to the roadmap?
context:
  product_type: b2b-saas
  deal_value: 2000000
applicable_dimensions:
  - problem_framing
  - customer_reasoning
  - strategic_reasoning
  - business_reasoning
  - organizational_reasoning
  - trade_off_awareness
  - decision_quality
expected_behaviors:
  - Separate the customer's underlying requirement from the requested implementation.
  - Assess reusable segment value, contract terms, support cost, precedent, and opportunity cost.
  - Compare product, configuration, service, pilot, commercial exception, and decline options.
  - Establish a decision owner and evidence or conditions required for commitment.
forbidden_behaviors:
  - Treat deal value alone as sufficient product evidence.
  - Reject the request solely because current usage is low.
hard_failures:
  - Present unprovided pipeline or customer data as fact.
scoring_notes: The answer should integrate commercial value and product integrity rather than defaulting to either side.
tags:
  - enterprise
  - feature-request
status: draft
review:
  owner: product-os
  reviewers: []
  created_at: 2026-09-26
  updated_at: 2026-09-26
  next_review_at: null
