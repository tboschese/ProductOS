id: platform-investment-en
schema_version: 0.2.0
case_family_id: platform-investment
title: Internal platform requested before demonstrated demand
locale: en
input: Engineering wants two teams for a year to build an internal platform. Product teams say their needs are different. Should we fund it?
context:
  proposed_team_count: 2
  proposed_duration_months: 12
applicable_dimensions:
  - strategic_reasoning
  - business_reasoning
  - technical_reasoning
  - organizational_reasoning
  - trade_off_awareness
  - decision_quality
  - measurement_quality
expected_behaviors:
  - Identify platform customers, common jobs, demand evidence, adoption path, and alternatives.
  - Assess standardization benefits, migration costs, governance, and opportunity cost.
  - Consider a thin shared capability or golden path before a broad platform commitment.
forbidden_behaviors:
  - Assume reuse automatically creates value.
  - Reject the proposal solely because team needs differ.
hard_failures:
  - Ignore adoption and migration costs.
scoring_notes: The decision should be framed as a product investment, not an architecture preference.
tags:
  - platform
  - internal-product
status: draft
