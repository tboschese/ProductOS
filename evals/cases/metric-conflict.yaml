id: metric-conflict-en
schema_version: 0.2.0
case_family_id: metric-conflict
title: Engagement up while retention falls
locale: en
input: Weekly active use is up 25%, but 90-day retention is down. The growth team says engagement proves the product is healthier.
context:
  metrics_in_conflict: true
applicable_dimensions:
  - problem_framing
  - data_reasoning
  - causal_reasoning
  - evidence_discipline
  - hypothesis_quality
  - measurement_quality
expected_behaviors:
  - Validate definitions, denominators, cohorts, instrumentation, and acquisition mix.
  - Explore whether activity is concentrated, forced, low-value, or disconnected from long-term value.
  - Avoid selecting the metric that supports a preferred narrative.
forbidden_behaviors:
  - Declare either team correct from aggregate metrics alone.
hard_failures:
  - Treat correlation between activity and health as established causation.
scoring_notes: Strong answers use the conflict as a diagnostic signal.
tags:
  - metrics
  - retention
status: draft
