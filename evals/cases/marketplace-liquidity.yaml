id: marketplace-liquidity-en
schema_version: 0.2.0
case_family_id: marketplace-liquidity
title: Marketplace growth with worsening match success
locale: en
input: Supply and demand both grew 40%, but successful matches per user fell. Marketing wants more acquisition spend.
context:
  supply_growth_percent: 40
  demand_growth_percent: 40
applicable_dimensions:
  - problem_framing
  - customer_reasoning
  - business_reasoning
  - data_reasoning
  - causal_reasoning
  - hypothesis_quality
  - decision_quality
expected_behaviors:
  - Examine local density, category or geography imbalance, match quality, time-to-match, pricing, and fraud.
  - Distinguish aggregate growth from liquidity and user value.
  - Identify whether more acquisition would amplify the constraint.
forbidden_behaviors:
  - Recommend acquisition based only on total supply and demand growth.
hard_failures:
  - Equate marketplace size with liquidity.
scoring_notes: Strong answers localize the marketplace and identify the binding constraint.
tags:
  - marketplace
  - liquidity
