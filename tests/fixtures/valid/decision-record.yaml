id: retention-decision-example
schema_version: 0.2.0
title: Retention decline diagnostic
locale: en
created_at: 2026-09-26
request: Determine whether enterprise features are the right response to declining retention.
context:
  known:
    - Reported retention declined after acquisition accelerated.
  assumed:
    - The retention definition has not changed.
  unknown:
    - Whether acquisition mix changed.
decision:
  question: What should the team do next to address the reported retention decline?
  type: diagnosis
  owner: Product lead
  deadline: null
  time_horizon: Next planning cycle.
  reversibility: partially_reversible
  scope: Diagnose before committing to a large feature initiative.
  constraints:
    - Limited engineering capacity.
framing:
  stated_problem: The product lacks enterprise features.
  reframed_problem: The cause of the reported retention decline is not established.
  classification:
    - symptom
    - assumption
    - request
evidence:
  - id: evidence-one
    statement: Retention declined in the latest measured cohort.
    epistemic_status: observation
    modality: quantitative
    origin: user_provided
    source_refs: []
    confidence: medium
    limitations:
      - Instrumentation is not yet validated.
    temporal_relevance: Latest cohort.
uncertainties:
  - id: cohort-comparability
    question: Are retention cohorts comparable?
    category: data
    why_it_matters: A mix shift could explain the aggregate decline.
    evidence_ids:
      - evidence-one
    confidence: low
    dominant: true
    reduction_method: Validate instrumentation and segment cohorts.
    decision_change_evidence: A stable decline within equivalent segments.
    stop_criteria: Definitions and main segment comparisons are reviewed.
    residual_uncertainty: Unobserved differences may remain.
hypotheses:
  - id: acquisition-mix
    claim: Acquisition mix drove the decline.
    supporting_evidence_ids:
      - evidence-one
    contradicting_evidence_ids: []
    confidence: low
    impact_if_true: high
    test_method: Compare cohorts by source and segment.
    decision_change_evidence: No material difference across sources or segments.
    status: active
risks:
  - id: premature-feature-commitment
    category: business_viability
    statement: The team invests in features unrelated to churn.
    cause: A stakeholder hypothesis is treated as validated need.
    consequence: Capacity is consumed without improving retention.
    likelihood: medium
    impact: high
    stakeholders:
      - Product team
      - Customers
    reversibility: partially_reversible
    time_to_detect: One or more product cycles.
    prevention:
      - Run the diagnostic first.
    mitigation:
      - Time-box any prototype.
    contingency:
      - Stop if evidence criteria fail.
    owner: Product lead
    indicators:
      - Enterprise capabilities are absent from churn evidence.
    residual_risk: Qualitative churn evidence may be incomplete.
options:
  - id: diagnose-first
    name: Diagnose before commitment
    description: Validate data and competing hypotheses before selecting a solution.
    evidence_for_ids:
      - evidence-one
    evidence_against_ids: []
    trade_offs:
      - Delays solution commitment but reduces misdiagnosis risk.
  - id: build-enterprise-features
    name: Commit to enterprise features
    description: Accept the sales hypothesis and begin delivery.
    evidence_for_ids: []
    evidence_against_ids:
      - evidence-one
    trade_offs:
      - May support sales but lacks demonstrated retention relevance.
recommendation:
  decision: Run a focused retention diagnostic before committing to enterprise features.
  rationale: The decline is observed, but its cause and the requested solution are not established.
  evidence_ids:
    - evidence-one
  unknowns:
    - Cohort comparability.
    - Relationship between churn reasons and proposed features.
  confidence: medium
  conditions:
    - Reconsider if churn evidence consistently identifies missing enterprise capabilities.
  dissent:
    - Sales may prioritize near-term deal enablement independently of retention.
  defer: false
execution:
  actions:
    - Validate instrumentation and cohort definitions.
    - Segment retention and review churn evidence.
  dependencies:
    - Product analytics access.
  owners:
    - Product lead
measurement:
  baseline: Current cohort retention by segment is not yet validated.
  success_metrics:
    - Validated explanation accounts for a material share of the decline.
  leading_indicators:
    - Instrumentation checks completed.
  guardrails:
    - Do not make external roadmap commitments during diagnosis.
  counter_metrics:
    - Sales-cycle impact of delayed enterprise work.
  window: One diagnostic cycle.
  instrumentation_checks:
    - Event and cohort definitions are stable over time.
learning:
  status: not_started
  review_at: null
  questions:
    - Which hypothesis best explains the segmented decline?
