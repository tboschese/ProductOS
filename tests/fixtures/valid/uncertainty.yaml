id: cohort-comparability
question: Are the compared retention cohorts equivalent enough to support the diagnosis?
category: data
why_it_matters: A mix shift could create an apparent product problem.
evidence_ids:
  - evidence-one
confidence: low
dominant: true
reduction_method: Validate instrumentation and segment retention by source and customer profile.
decision_change_evidence: Stable within-segment decline would weaken the acquisition-mix explanation.
