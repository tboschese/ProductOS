id: misdiagnose-retention
category: business_viability
statement: Acting on the wrong retention cause could consume capacity without improving retention.
cause: The team accepts the sales hypothesis before validating competing explanations.
consequence: Delayed retention recovery and opportunity cost.
likelihood: medium
impact: high
stakeholders:
  - Product team
  - Customers
reversibility: partially_reversible
time_to_detect: One or more product cycles.
prevention:
  - Validate cohort and instrumentation assumptions first.
mitigation:
  - Use a time-boxed diagnostic before a large commitment.
contingency:
  - Stop the initiative if decision criteria are not met.
owner: Product lead
indicators:
  - No relationship between proposed capabilities and churn reasons.
residual_risk: Diagnostic evidence may remain incomplete.
