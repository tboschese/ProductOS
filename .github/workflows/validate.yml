name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_repository.py
      - run: python -m scripts.build_indexes --check
      - run: python -m scripts.check_duplicates
      - run: python -m scripts.audit_sources --fail-stale
      - name: Validate archived pilot assessments without model calls
        run: >-
          python -m scripts.evaluate_results evals/baselines/seed-pilot-2026-10-05/run.json
          --review-packet evals/baselines/seed-pilot-2026-10-05/snapshot/reviewer.json
      - run: pytest
      - run: ruff check .
