id: review-decision-quality
schema_version: 0.3.0
name: Review decision quality after an outcome
purpose: Separate evaluation of the original decision from learning provided by its outcome.
primary_domain: decision-making
facets:
  capabilities:
    - decision-making
decision_pattern_ids:
  - post-outcome-decision-review
entry_conditions:
  - A material decision has produced an observable outcome.
guiding_questions:
  - What information and uncertainty were available when commitment became costly to reverse?
  - Which alternatives and values were considered?
  - Did the outcome reveal new information or merely realize known uncertainty?
adaptive_actions:
  - Reconstruct the ex-ante decision record before discussing the result.
  - Evaluate framing, evidence, alternatives, logic, and commitment quality.
  - Update beliefs and process only where the outcome is informative for similar future decisions.
avoid:
  - Scoring the decision from the outcome alone.
  - Ignoring valid learning because outcomes should not determine ex-ante quality.
exit_conditions:
  - The review separately states original decision quality and future learning.
  - Updates identify the evidence and contexts to which they apply.
measures:
  - Review contains no unsupported hindsight claims.
  - Action items link to a demonstrated process or calibration gap.
claim_ids:
  - outcome-bias-affects-evaluation
  - decision-quality-evaluated-ex-ante
  - outcomes-update-future-beliefs
status: in_review
review:
  owner: product-os
  reviewers: []
