id: outcomes-update-future-beliefs
schema_version: 0.3.0
statement: Outcome information can appropriately update beliefs for future similar decisions even when it should not be used to rewrite what was knowable in the original decision.
epistemic_status: interpretation
evidence_modality: mixed
supporting_sources:
  - source_id: baron-hershey-1988
    locator: pp. 569–570, appropriate indirect roles of outcome information
    role: supports
  - source_id: sdp-core-principles
    locator: Core Principles 5 and 10
    role: background
contradicting_sources: []
confidence: medium
limitations:
  - Learning requires sufficiently similar repeated decisions and valid outcome measurement.
  - A single outcome may provide little information about prior calibration.
primary_domain: decision-making
facets:
  capabilities:
    - decision-making
