id: decision-quality-evaluated-ex-ante
schema_version: 0.3.0
statement: A decision under uncertainty should be evaluated primarily from the information, alternatives, values, and constraints available when the commitment was made, rather than from the realized outcome alone.
epistemic_status: recommendation
evidence_modality: mixed
supporting_sources:
  - source_id: baron-hershey-1988
    locator: pp. 569–570, distinction between actor, judge, and joint information
    role: supports
  - source_id: sdp-core-principles
    locator: Core Principles 3–5
    role: supports
contradicting_sources: []
confidence: high
limitations:
  - This is partly a normative decision-quality principle rather than a purely empirical claim.
  - Ex-ante review still requires judging whether beliefs and values were reasonably formed.
primary_domain: decision-making
facets:
  capabilities:
    - decision-making
