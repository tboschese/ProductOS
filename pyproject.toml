[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-os-foundation"
version = "0.3.0a6"
description = "Evidence-aware ProductOS terminal and repository tooling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
  "referencing>=0.35,<1",
]

[project.optional-dependencies]
terminal = ["textual>=8.2,<9"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "textual>=8.2,<9",
]

[project.scripts]
productos = "productos.cli:main"

[tool.setuptools.packages.find]
include = ["productos*", "scripts*"]

[tool.setuptools.package-data]
productos = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
