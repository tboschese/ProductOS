[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-os-foundation"
version = "0.1.0"
description = "Validation tooling for the ProductOS knowledge and reasoning repository"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
  "referencing>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
