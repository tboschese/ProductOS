id: res-004-strategy-as-coherent-choices
schema_version: 0.3.0
title: Product strategy as coherent choices
primary_domain: product-strategy
research_question: How should ProductOS test whether a product strategy, roadmap, or goal set expresses coherent choices rather than a list of aspirations?
why_it_matters: The roadmap-overload, bad-okrs, platform-investment, and legacy-modernization cases require recognizing missing trade-offs, unfocused goals, and investments disconnected from a diagnosis.
scope:
  - Strategy as a diagnosis, guiding policy, and coherent actions.
  - Where-to-play and how-to-win choices and what they exclude.
  - Observable signs of incoherent or aspirational strategy.
out_of_scope:
  - Competitive analysis methods and market sizing.
  - Portfolio management and capital allocation processes.
  - Strategy deployment through OKRs, covered by later goal-systems research.
subtopics:
  - Diagnosis and guiding policy.
  - Explicit exclusions and trade-offs.
  - Coherence between strategy, goals, and roadmap.
primary_source_plan:
  - "Candidate to verify: Rumelt, Good Strategy/Bad Strategy (2011), for the kernel of diagnosis, guiding policy, and coherent action."
  - "Candidate to verify: Lafley and Martin, Playing to Win (2013), for integrated strategic choices."
  - Empirical management research, where it exists, on strategic focus and performance.
secondary_source_plan:
  - Product-specific strategy writing, labeled as opinion where it lacks evidence.
questions:
  - Which observable properties distinguish a strategy from a goal or a list of initiatives?
  - How should a response surface the trade-offs an organization is avoiding?
  - When is a deliberately emergent strategy preferable to explicit upfront choices?
expected_outputs:
  - Source and claim records with locators and limitations.
  - Concepts and terminology for strategic diagnosis, coherence, and exclusion.
  - A decision pattern for reviewing a strategy or roadmap for coherence.
  - An anti-pattern for aspirational goals presented as strategy.
  - Eval proposals tied to roadmap-overload, bad-okrs, and platform-investment.
conflicting_views_to_investigate:
  - Deliberate strategy through explicit choices versus emergent strategy discovered through action.
  - Influential strategy books rely heavily on illustrative cases rather than systematic evidence.
acceptance_criteria:
  - Book-based frameworks are recorded with their evidentiary limits and not as validated theory.
  - Guidance yields observable review behaviors rather than template vocabulary.
  - Every published entity validates and connects to at least one eval behavior.
review_status: draft
