id: res-002-reversibility-and-evidence-threshold
schema_version: 0.3.0
title: Proportioning evidence to reversibility and stakes
primary_domain: decision-making
research_question: How should ProductOS decide how much evidence a product decision needs before commitment, given its reversibility, stakes, and the cost of delay?
why_it_matters: The seed cases repeatedly require choosing between acting now, running a bounded diagnostic, or gathering more evidence. Without an explicit threshold model, recommendations drift toward either reflexive caution or unsupported confidence.
scope:
  - Distinguishing reversible from hard-to-reverse product decisions and how that changes the required evidence.
  - Value of information and the cost of delay as inputs to whether more evidence is worth gathering.
  - Staged commitment, such as pilots, limited rollouts, and kill criteria, as ways to reduce irreversibility.
out_of_scope:
  - Quantitative expected-value or decision-tree modeling beyond what is needed to state the principle.
  - Organizational decision-rights frameworks.
  - Experiment design and statistics, covered by later experimentation research.
subtopics:
  - Reversibility classification.
  - Value of information.
  - Cost of delay and opportunity cost.
  - Staged commitment and kill criteria.
primary_source_plan:
  - "Candidate to verify: the value-of-information literature in decision analysis (Howard, information value theory, 1966)."
  - "Candidate to verify: Amazon's 2015 shareholder letter on Type 1 and Type 2 decisions, as a primary practitioner statement."
  - Empirical studies, if any, on decision speed versus quality in product or management contexts.
secondary_source_plan:
  - Decision-analysis professional standards, reusing sdp-core-principles where applicable.
  - Practitioner writing on reversible decisions, used only to illustrate and labeled as opinion.
questions:
  - Which properties of a decision make it hard to reverse, and how can a response state them observably?
  - When is gathering more evidence not worth its cost?
  - How should a recommendation communicate the evidence that would change it?
expected_outputs:
  - Source and claim records with locators and limitations.
  - Concepts and terminology for reversibility and value of information, after duplicate search.
  - A decision pattern for matching evidence requirements to reversibility and stakes.
  - An anti-pattern for applying a single evidence bar to all decisions.
  - Eval proposals or revisions tied to small-experiment-sample, product-sunset, and pricing-change.
conflicting_views_to_investigate:
  - Bias toward speed improves learning velocity versus bias toward rigor avoids costly lock-in.
  - Reversibility is often misjudged, because reputational, contractual, and data effects persist after a technical rollback.
acceptance_criteria:
  - The task distinguishes primary decision-analysis evidence from practitioner opinion.
  - Guidance produces observable behaviors a judge can mark, not a general exhortation to be careful.
  - Every published entity validates and connects to at least one eval behavior.
