id: res-003-customer-evidence-quality
schema_version: 0.3.0
title: Customer evidence quality and stakeholder requests
primary_domain: customer-understanding
research_question: How should ProductOS assess the quality of customer evidence and separate an underlying customer need from a stakeholder-requested solution?
why_it_matters: Accepting a stakeholder request as validated customer need is a declared hard failure in the rubric, and the enterprise-feature-request and retention-decline cases depend on separating needs from requested implementations.
scope:
  - Levels of customer evidence, from anecdote and request to observed behavior and outcome data.
  - Known biases in stated preferences, interviews, and sales-relayed requests.
  - Separating the job or problem from the requested feature.
out_of_scope:
  - A full survey of discovery methods and research operations.
  - Persona and ICP construction.
  - Quantitative survey methodology.
subtopics:
  - Stated versus revealed preference.
  - Request intermediaries such as sales, support, and executives.
  - Problem versus solution framing.
  - Evidence quality ladders.
primary_source_plan:
  - Peer-reviewed evidence on the gap between stated intentions and behavior.
  - "Candidate to verify: Christensen and colleagues on jobs to be done (Harvard Business Review, 2016)."
  - Research on interview and survey biases relevant to product discovery.
secondary_source_plan:
  - Practitioner discovery literature, labeled as opinion where it lacks empirical support.
questions:
  - Which customer signals are strong enough to justify commitment, and under which conditions?
  - How should a response handle a request relayed by someone with an incentive, such as a deal-linked sales request?
  - What does materially separating need from implementation look like in an answer?
expected_outputs:
  - Source and claim records with locators and limitations.
  - Concepts and terminology for customer evidence quality and stated versus revealed preference.
  - A decision pattern for evaluating a stakeholder-relayed request.
  - An anti-pattern for treating requests or deal value as validated need.
  - Eval proposals tied to enterprise-feature-request and retention-decline, including localized variants.
conflicting_views_to_investigate:
  - Customers cannot articulate needs reliably versus dismissing explicit requests discards valuable signal.
  - Jobs-to-be-done framing is broadly useful versus its evidence base is largely practitioner case studies.
acceptance_criteria:
  - Each evidence level is described by observable properties rather than authority.
  - Contested frameworks are recorded with their evidence limits rather than adopted wholesale.
  - Every published entity validates and connects to at least one eval behavior.
review_status: draft
