id: res-001-decision-quality-outcomes
schema_version: 0.3.0
title: Decision quality versus outcome quality
primary_domain: decision-making
research_question: How should ProductOS distinguish decision quality from outcome quality when reviewing product decisions under uncertainty?
why_it_matters: Product reviews can reward lucky outcomes or punish sound decisions that encountered unfavorable uncertainty, degrading learning and future choices.
scope:
  - Definition of decision quality at the time of commitment.
  - Empirical evidence for outcome bias in decision evaluation.
  - Appropriate use of outcomes for learning after a decision.
out_of_scope:
  - Comprehensive decision-analysis methodology.
  - Quantitative expected-value modeling.
  - Performance-management policy.
subtopics:
  - Outcome bias.
  - Ex-ante versus ex-post evaluation.
  - Decision review and learning.
primary_source_plan:
  - Review the original Baron and Hershey outcome-bias experiments.
  - Review a preregistered replication and extension.
secondary_source_plan:
  - Review standards from the Society of Decision Professionals.
questions:
  - What information is legitimate when evaluating a past decision?
  - When can outcomes appropriately update future beliefs?
  - What observable anti-pattern should ProductOS prevent?
expected_outputs:
  - Source and claim records.
  - Decision-quality and outcome-bias concepts and terminology.
  - An anti-pattern, decision pattern, relationships, playbook, and eval case.
conflicting_views_to_investigate:
  - Outcomes can reveal information that was hidden at commitment and should not be ignored in learning.
  - Process quality alone may omit whether a decision model was well calibrated.
acceptance_criteria:
  - Original and replication evidence include precise locators and limitations.
  - Guidance distinguishes evaluating the original choice from updating beliefs after outcomes.
  - All entities validate and are connected to an observable eval behavior.
review_status: in_review
